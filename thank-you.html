<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | EverRest Memorial</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .thank-you {
      max-width: 560px;
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 64px 48px;
      box-shadow: var(--shadow);
    }
    .thank-you-icon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--bg-warm);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1.8rem;
      margin-bottom: 28px;
    }
    .thank-you h1 {
      font-size: 2.2rem;
      margin-bottom: 16px;
    }
    .thank-you p {
      color: var(--text-light);
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.1rem;
      margin-bottom: 32px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="thank-you">
    <div class="thank-you-icon"><i class="fas fa-envelope-open-text"></i></div>
    <h1>Thank You</h1>
    <p>Your enquiry has been received. We read every message personally and will be in touch within one working day.</p>
    <a href="index.html" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Return Home</a>
  </div>
</body>
</html>
